plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'me.ladypaladra.thearmorymod'
version = '1.25.0'

repositories {
    mavenCentral()
    maven { url = uri('https://telemetry.alecsmods.com/maven/releases') }
    maven { url = uri('https://maven.hytalemodding.dev/releases') }
}

def serverJarPath = file('libs/HytaleServer.jar')
def projectServerJar = file('server/HytaleServer.jar')
def siblingServerJar = file('../server/HytaleServer.jar')

// One home for the engine jar. The four way cascade used to be written out once for the
// compile classpath and would have had to be repeated for the test classpath, and copies
// of one path are how they drift apart.
def engineJar = [serverJarPath, projectServerJar, siblingServerJar].find { it.exists() }
        ?: file('libs/HytaleServer.jar')

dependencies {
    compileOnly files(engineJar)

    // The engine belongs on the test classpath, and deliberately not as compileOnly.
    // ScribingSeal and ScribingWrite both work on ItemStack and BsonDocument, and both
    // types reach this project only through this jar. Without it the properties the sealed
    // inscription rests on cannot be asserted at all: that a seal survives a round trip,
    // that inscribing refuses a sealed item, and above all that writing an inscription
    // preserves every unrelated metadata key. Those were being carried on a code read.
    // Nothing ships from here, shadowJar already excludes the com.hypixel group.
    testImplementation files(engineJar)

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    // The engine requires a whole vanilla asset to change one field, which left this mod
    // carrying 41 verbatim copies of Hypixel's files. Each copy is frozen, so a vanilla
    // change to that item never reaches a player and nothing reports it. Patchly ships only
    // the difference and merges the rest from whatever version of the game is installed.
    //
    // The version is pinned because this asset merge layer decides what every one of those
    // items actually is at runtime. That version should change when we choose, not when a
    // build machine resolves a range. The dependency is shaded into this jar, so a server
    // owner installs nothing extra.
    implementation 'com.riprod:patchly:3.6.2'
    // Pinned at 1.2.1 because the docs name unpublished 1.1.0. Version 1.2.1 moved uploads
    // onto isolated virtual threads so a slow upload cannot delay unrelated server tasks.
    implementation 'com.alechilles:alecstelemetry-runtime:1.2.1'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.ibm.icu:icu4j:71.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Pin the source encoding, because javac otherwise reads these files in whatever encoding the
// build machine happens to default to. That is not a theoretical risk here. Three files carry
// characters outside ASCII, and one of them sits inside a string literal that is logged, so a
// machine defaulting to windows-1252 compiles a message that reads as mojibake to whoever runs
// the server. Measured: the same literal compiles to e2 80 94 under UTF-8 and to
// c3 a2 e2 82 ac e2 80 9d under windows-1252, and the build succeeds either way without a
// warning. Anyone who clones this repository should get the same bytes we do.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

shadowJar {
    // Patchly publishes one artifact that is both a droppable plugin and a shadeable library,
    // so its jar root carries a manifest.json and an icon-256.png of its own. Shadow merges
    // dependency roots into this one and the first copy of a path wins, and the main source
    // set output is added ahead of the runtime configuration, so this project's copies are the
    // ones that ship. That held by accident of ordering rather than by declaration, and a jar
    // carrying another author's manifest identifies itself to the engine as their plugin while
    // the build, the schema validator and the diff all stay quiet. Declare the first-wins rule
    // rather than inheriting it.
    //
    // Relocating com.riprod was considered and rejected. It buys no isolation that is not
    // already present, because the engine gives every jar plugin its own class loader and
    // Patchly is absent from the server class path, so this copy is the one that binds either
    // way. It also carries real risk, since shading rewrites matching strings as well as class
    // references, and Patchly has not been tested under a rewritten package name.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier.set('')
    // The standalone dependency includes development tooling that this plugin never runs.
    // Its engine calls must not become part of the runtime we ship.
    exclude 'com/azuredoom/**'
    inputs.property('excludePatterns', excludes.sort())
    dependencies {
        exclude(dependency { it.moduleGroup == 'com.hypixel' })
    }
}

// Keep authoring sources out of what a server owner downloads.
//
// Lady works in Hytale's own asset editor and in Blockbench, and both leave their
// project file sitting beside the exported one. The engine never reads either. The
// three .prefab.json.lpf are 2.5 MB on their own, which was 7.5 percent of the jar.
//
// These stay in the repository on purpose, because they are how she edits a prefab
// again later. They just have no business being shipped. Every one of them sits next
// to the live asset it produced, checked before this was added, so excluding them
// cannot make anything the only copy of itself.
processResources {
    exclude '**/*.lpf'
    exclude '**/*.bbmodel'
    exclude '**/*.bck'
    exclude '**/*.bak'
}

// The HStats ingest key is absent from this repository on purpose. This repository is public,
// and committing the private credential would hand a working value to anyone reading its
// history. The key still has to ship inside the jar because the service has no other way to
// authenticate reports, so anyone who unzips a release can read it. That is a limit of the
// service rather than something this build can fix. A keyless build is normal and reports
// nothing, which is the safe direction to fail.
//
// Gradle already sources a project property from the per-user ~/.gradle/gradle.properties,
// from -P on the command line and from an ORG_GRADLE_PROJECT_armoryHstatsKey environment
// variable. The environment form is what a build machine wants.
def localHstatsFile = file('hstats.properties')
def localHstatsProperties = new Properties()
if (!project.hasProperty('armoryHstatsKey') && localHstatsFile.isFile()) {
    localHstatsFile.withInputStream { stream ->
        localHstatsProperties.load(stream)
    }
}

def resolvedArmoryHstatsKey = project.hasProperty('armoryHstatsKey')
        ? project.property('armoryHstatsKey').toString().trim()
        : localHstatsProperties.getProperty('armoryHstatsKey', '').trim()
def resolvedArmoryVersion = project.version.toString()
def generatedHstatsDirectory = layout.buildDirectory.dir('generated/hstats')

def generateHstatsConfig = tasks.register('generateHstatsConfig') {
    inputs.property('key', resolvedArmoryHstatsKey)
    inputs.property('version', resolvedArmoryVersion)
    outputs.dir(generatedHstatsDirectory)

    // A silent keyless release is easy to mistake for a reporting build, so make the safe
    // no-report state visible whenever this task runs.
    doFirst {
        if (resolvedArmoryHstatsKey.isEmpty()) {
            println 'This build will not report to HStats because no armoryHstatsKey property was supplied.'
        }
    }

    doLast {
        def outputFile = generatedHstatsDirectory.get().file(
                'me/ladypaladra/thearmorymod/metrics/hstats.properties'
        ).asFile
        outputFile.parentFile.mkdirs()

        // Properties.store writes a timestamp comment, which changes the file on every build
        // and would defeat the up to date check.
        outputFile.setText(
                "key=${resolvedArmoryHstatsKey}\nversion=${resolvedArmoryVersion}\n",
                'UTF-8'
        )
    }
}

tasks.named('processResources') {
    dependsOn generateHstatsConfig
    from(generatedHstatsDirectory)
}

tasks.named('jar') {
    enabled = false
}

tasks.named('build') {
    dependsOn shadowJar
    dependsOn 'verifyBundledRuntime'
}

tasks.register('verifyBundledRuntime') {
    group = 'verification'
    dependsOn shadowJar
    inputs.file(shadowJar.archiveFile)
    doLast {
        new java.util.zip.ZipFile(shadowJar.archiveFile.get().asFile).withCloseable { archive ->
            def entries = archive.entries().toList()*.name
            if (entries.any { it.startsWith('com/azuredoom/') }) {
                throw new GradleException('Standalone development tooling is present in the runtime jar.')
            }
            if (!entries.contains('com/riprod/patchly/PatchManager.class')) {
                throw new GradleException('The bundled patch manager is missing from the runtime jar.')
            }
        }
    }
}

// The jar a release ships. Test builds and deploys never run this. It takes the built jar,
// rearranges every model texture so that each picture a face shows is stored once and nothing
// else is, proves that every face of every model still shows exactly the same texels, and
// stamps the result. A player sees no difference and the jar is smaller, 54 MB down to 44 MB
// on 1.25.0. The source is never touched, so the art stays exactly as it was made.
//
// The optimiser lives outside this repository. Its location is read from the per-user
// ~/.gradle/gradle.properties (texopt.python, texopt.pythonpath, texopt.tools), so this public
// file names no local path. A machine without them gets a clear failure from this task alone,
// and every other task works as before.
def texoptPython = providers.gradleProperty('texopt.python')
def texoptPythonPath = providers.gradleProperty('texopt.pythonpath')
def texoptTools = providers.gradleProperty('texopt.tools')
def releaseJarFile = layout.buildDirectory.file(shadowJar.archiveFile.map { "release/${it.asFile.name}" })

tasks.register('releaseJar') {
    group = 'build'
    description = 'Builds the release jar in build/release with every model texture optimised, proved and stamped.'
    dependsOn shadowJar, 'verifyBundledRuntime'
    inputs.file(shadowJar.archiveFile)
    outputs.file(releaseJarFile)
    // The optimiser changes outside this build. It keeps its own record of past results, so a
    // rerun with unchanged art takes seconds.
    outputs.upToDateWhen { false }
    doLast {
        def required = { provider, key ->
            if (!provider.present) {
                throw new GradleException("releaseJar needs ${key} in ~/.gradle/gradle.properties.")
            }
            provider.get()
        }
        def python = required(texoptPython, 'texopt.python')
        def pythonPath = required(texoptPythonPath, 'texopt.pythonpath')
        def tools = required(texoptTools, 'texopt.tools')
        def vanilla = file("${System.getenv('APPDATA')}/Hytale/install/release/package/game/latest/Assets.zip")
        if (!vanilla.isFile()) {
            throw new GradleException("releaseJar found no release Assets.zip at ${vanilla}.")
        }
        def output = releaseJarFile.get().asFile
        output.parentFile.mkdirs()
        def memory = new File(System.getProperty('user.home'), '.cache/texopt').path
        def run = { List arguments ->
            def builder = new ProcessBuilder(([python] + arguments)*.toString()).redirectErrorStream(true)
            builder.environment().put('PYTHONPATH', pythonPath)
            def process = builder.start()
            def text = process.inputStream.getText('UTF-8')
            def code = process.waitFor()
            if (code != 0) {
                throw new GradleException("releaseJar: ${new File(arguments[0].toString()).name} failed with exit ${code}.\n${text.takeRight(3000)}")
            }
            text.readLines().findAll { it.trim() && !it.startsWith('EXIT=') }.takeRight(2).each { println it }
        }
        run(["${tools}/optimize_jar.py", shadowJar.archiveFile.get().asFile.path, output.path,
             '--cache', memory, '--vanilla', vanilla.path])
        run(["${tools}/texopt_stamp.py", 'check', output.path])
        println "Release jar: ${output}"
    }
}

// The plugin without its asset pack, for working on the mod's files in the game directly.
//
// The game loads Java only from a jar in a mods folder, and it refuses two packs with the same
// name, so the normal jar and a folder of the mod's files cannot sit side by side. This jar
// declares IncludesAssetPack false, so the game loads the plugin from it and takes every item,
// model and texture from the folder instead, and a file saved there reaches the game without a
// build. It keeps the one asset the Java reads from its own jar, the Alteration Table page.
//
// It is committed under Studio/Tools so that pulling the repository always brings the code that
// matches the files beside it. Timestamps and entry order are fixed, so the file only changes
// when the code does, and the build rewrites it every time so it can never fall behind. It
// carries no HStats key, because it lives in a public repository and a working copy has
// nothing to report.
def studioDirectory = layout.buildDirectory.dir('generated/studio')

def generateStudioCodeFiles = tasks.register('generateStudioCodeFiles') {
    def manifestSource = file('src/main/resources/manifest.json')
    inputs.file(manifestSource)
    inputs.property('version', resolvedArmoryVersion)
    outputs.dir(studioDirectory)
    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(manifestSource, 'UTF-8')
        if (manifest.IncludesAssetPack != true) {
            throw new GradleException('manifest.json no longer declares IncludesAssetPack true, so the code-only jar cannot be derived from it.')
        }
        manifest.IncludesAssetPack = false
        def root = studioDirectory.get().asFile
        new File(root, 'manifest.json').setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + '\n', 'UTF-8')
        def metrics = new File(root, 'me/ladypaladra/thearmorymod/metrics/hstats.properties')
        metrics.parentFile.mkdirs()
        metrics.setText("key=\nversion=${resolvedArmoryVersion}\n", 'UTF-8')
    }
}

def studioCodeJar = tasks.register('studioCodeJar', Jar) {
    group = 'build'
    description = 'Builds Studio/Tools/TheArmory-code.jar, the plugin without its asset pack.'
    dependsOn shadowJar, generateStudioCodeFiles
    from({ zipTree(shadowJar.archiveFile) }) {
        exclude 'Common/**', 'Server/**', 'manifest.json', 'icon-256.png', 'META-INF/MANIFEST.MF'
        exclude 'me/ladypaladra/thearmorymod/metrics/hstats.properties'
    }
    from({ zipTree(shadowJar.archiveFile) }) {
        include 'Common/UI/Custom/Pages/TheArmory/AlterationPage.ui'
    }
    from(file('src/main/resources/icon-256.png'))
    from(studioDirectory)
    destinationDirectory = layout.projectDirectory.dir('Studio/Tools')
    archiveFileName = 'TheArmory-code.jar'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

tasks.named('build') {
    dependsOn studioCodeJar
}

tasks.named('test') {
    useJUnitPlatform()

    // Without this, any test that touches ItemStack dies in its static initializer.
    // ItemStack pulls in Item, then ItemReticleConfig, then the codec validators, then
    // HytaleLogger, and HytaleLogger refuses to initialize unless its own log manager is
    // installed first. The failure surfaces as a bare NoClassDefFoundError on the ItemStack
    // constructor, which points nowhere near the real cause, so the reason is written here.
    // The engine asks for this itself, in the exception text it throws.
    //
    // The package matters and the exception does not give it. The class is under
    // logger.backend, not logger.
    systemProperty 'java.util.logging.manager', 'com.hypixel.hytale.logger.backend.HytaleLogManager'
}

tasks.register('copyServerJar') {
    doLast {
        def destJar = file('libs/HytaleServer.jar')
        if (!destJar.exists()) {
            def sources = [file('server/HytaleServer.jar'), file('../server/HytaleServer.jar')]
            def appData = System.getenv('APPDATA')
            if (appData) {
                sources.add(file("${appData}/Hytale/install/release/package/game/latest/Server/HytaleServer.jar"))
            }
            def sourceJar = sources.find { it.isFile() }
            if (sourceJar == null) {
                throw new GradleException('No Hytale server jar was found. Install the release channel or provide server/HytaleServer.jar.')
            }
            copy {
                from sourceJar
                into 'libs'
            }
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'copyServerJar'
}

tasks.register('deployToServer', Copy) {
    from shadowJar
    into 'server/mods'
    doLast {
        println "Deployed to server/mods/"
    }
}

tasks.register('watch') {
    doLast {
        println "Watching for changes... Press Ctrl+C to stop."
        println "Run 'gradle build --continuous' for auto-rebuild on file changes."
    }
}
