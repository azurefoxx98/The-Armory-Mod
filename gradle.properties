# The mod's identity and its game versions, in one place. AzureDoom's Hytale Gradle plugin reads
# these keys and writes src/main/resources/manifest.json from them on every build, so change a value
# here and never in manifest.json, where the next build would put the old one back.

# The mod
version                   = 1.25.0
manifest_group            = LadyPaladra
mod_id                    = TheArmory
mod_description           = Over 1,300 pieces of armor, weapons and shields. Most come in several colours you can swap at the Alteration Table.
mod_credits               = LadyPaladra
mod_url                   = https://www.curseforge.com/hytale/mods/the-armory
main_class                = me.ladypaladra.thearmorymod.TheArmoryMod
curseforgeID              = 1448501
includes_pack             = true
disabled_by_default       = false
manifest_dependencies     =
manifest_opt_dependencies =

# The game
# The build compiles against the newest release of the game, fetched from Hypixel's own repository,
# so nobody needs the game installed to build. The manifest names the oldest release the mod still
# supports. Raise it only when a game update breaks something on the older releases.
java_version              = 25
hytale_version            = 0.+
hytale_patchline          = release
manifest_server_version   = >=0.7.0

# Download sources the plugin adds that this mod never uses. Each one is another host a build
# depends on, so they stay off. Patchly and the telemetry library come from the repositories named
# in build.gradle.
hytools.repos.disableHytaleModsInfoMaven = true
hytools.repos.disablePlaceholderApiMaven = true
hytools.repos.disableCurseMaven          = true
hytools.repos.disableAzureDoomMaven      = true
hytools.repos.disableModtaleResolver     = true
hytools.repos.disableModifoldRepo        = true
